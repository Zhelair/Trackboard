<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#141414" />
  <title>Trackboard</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/app-icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true"></div>
        <div>
          <div class="brand-title">Trackboard</div>
          <div id="brand-subtitle" class="brand-subtitle">Private · Stored on this device</div>
        </div>
      </div>
      <button id="btn-settings" class="icon-btn" title="Settings" aria-label="Settings">⚙️</button>
    </header>

    <main id="view" class="view" aria-live="polite"></main>

    <nav class="bottomnav">
      <button class="navbtn" data-route="home">Home</button>
      <button class="navbtn" data-route="checkin">Check-in</button>
      <button class="navbtn" data-route="alcohol">Alcohol</button>
      <button class="navbtn" data-route="calm">Calm</button>
      <button class="navbtn" data-route="insights">Insights</button>
    </nav>

    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  </div>

  <script src="js/router.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/store.js"></script>

  <script src="js/features/home.js"></script>
  <script src="js/features/checkin.js"></script>
  <script src="js/features/alcohol.js"></script>
  <script src="js/features/stress.js"></script>
  <script src="js/features/goals.js"></script>
  <script src="js/features/calm.js"></script>
  <script src="js/features/insights.js"></script>
  <script src="js/features/settings.js"></script>

  <script src="js/app.js"></script>
</body>
</html>
